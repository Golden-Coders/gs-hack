# Nakładka na docker-compose.yml dla testów obciążenia (izolowany projekt, np. `-p gsload`):
#  - osobny tag obrazu (nie nadpisuje alerting-backend:dev używanego przez stos deweloperski),
#  - brak publikowanych portów na hoście (brak konfliktu z działającym stosem; ruch generujemy z sieci compose),
#  - bez UI (zbędny w teście).
x-img: &img
  image: alerting-backend:loadtest

services:
  backend-build: { <<: *img }
  api:           { <<: *img, ports: !reset [] }
  ingest:        { <<: *img, ports: !reset [] }
  lifecycle:     { <<: *img }
  router:        { <<: *img }
  sender:        { <<: *img }
  runbooks:      { <<: *img }
  mock-targets:  { <<: *img, ports: !reset [] }
  loadgen:       { <<: *img }
  redpanda:
    ports: !reset []
    # RP_SMP/RP_MEM: liczba rdzeni reaktora i pamięć brokera (domyślnie jak w docker-compose.yml: 1 / 1G).
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=${RP_SMP:-1}
      - --memory=${RP_MEM:-1G}
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
  postgres:
    ports: !reset []
    # PG_MAXCONN: limit połączeń (domyślnie 100 jak w obrazie); PG_SHARED_BUFFERS np. 1GB do testów strojenia.
    command: ["postgres", "-c", "max_connections=${PG_MAXCONN:-100}", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"]
  mailpit:       { ports: !reset [] }
  ui:            { profiles: ["disabled"], ports: !reset [] }
