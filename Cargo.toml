[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Wspólne wersje zależności (zamrożone w Fazie 0).
# Crate dodaje zależność we własnym Cargo.toml jako `nazwa = { workspace = true }`.
# Nowa wersja lub nowa zależność tutaj = PR + ping do zespołu.
[workspace.dependencies]
# wewnętrzne
contracts = { path = "crates/contracts" }
condition = { path = "crates/condition" }
common = { path = "crates/common", default-features = false }

# runtime / HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
async-stream = "0.3"

# serializacja
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_json_path = "0.7"

# dane
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# konfiguracja i reguły
minijinja = "2"
regex = "1"
globset = "0.4"
arc-swap = "1"
notify = "8"

# kanały
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# obserwowalność i błędy
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = 1
